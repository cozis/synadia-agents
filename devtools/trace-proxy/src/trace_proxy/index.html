<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>trace-proxy</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1c2330; --muted: #68738a;
    --line: #e2e6ee; --accent: #3757c4; --ok: #2f8a4c; --warn: #b3661d; --err: #b03636;
    --box: #f2f5fb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 12px;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--card);
  }
  header h1 { font-size: 16px; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; }
  #status { margin-left: auto; font-size: 13px; color: var(--muted); }
  main { max-width: 980px; margin: 0 auto; padding: 20px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .tree-group {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    margin-bottom: 16px; padding: 14px 18px;
  }
  .tree-group > h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
  .node { padding: 4px 0; }
  .node .kids { margin-left: 14px; border-left: 2px solid var(--line); padding-left: 16px; }
  .node-line { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.err { background: var(--err); }
  .dot.busy { background: var(--warn); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .badge {
    font-size: 11px; padding: 1px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
  }
  .badge.root { color: var(--accent); border-color: var(--accent); }
  .badge.tool { color: var(--ok); border-color: var(--ok); }
  .badge.prog { color: var(--warn); border-color: var(--warn); }
  .badge.pending { color: var(--err); border-color: var(--err); }
  .stats { color: var(--muted); font-size: 12.5px; }
  .convo { margin: 4px 0 4px 18px; font-size: 12.5px; }
  .turn { display: flex; gap: 8px; padding: 3px 0; }
  .turn .role { flex: none; width: 70px; font-size: 11px; text-transform: uppercase;
                letter-spacing: 0.04em; color: var(--muted); padding-top: 1px; }
  .turn .role.user { color: var(--accent); }
  .turn .role.assistant { color: var(--ok); }
  .turn .role.tool { color: var(--warn); }
  .turn .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .toolbox {
    border: 1px solid var(--line); border-left: 3px solid var(--warn);
    background: var(--box); border-radius: 6px;
    margin: 5px 0 5px 78px; padding: 6px 10px;
  }
  .tool-head { color: var(--warn); overflow-wrap: anywhere; }
  .tool-head .tool-id { color: var(--muted); font-size: 11px; margin-left: 6px; }
  .toolbox .turn .role { width: 54px; }
  .tool-kids { margin-top: 4px; border-top: 1px dashed var(--line); padding-top: 4px; }
  #untraced { color: var(--muted); font-size: 13px; margin-top: 18px; }
</style>
</head>
<body>
<header>
  <h1>trace-proxy</h1>
  <span class="sub">conversation trees — child threads attach at the tool call that spawned them</span>
  <span id="status">connecting…</span>
</header>
<main>
  <div id="forest"><div class="empty">no traced traffic yet</div></div>
  <div id="untraced"></div>
</main>
<script>
"use strict";

// Server-side ThreadStore is the source of truth; every SSE message is
// a full thread record (an upsert) or a {type:"meta"} counter update.
const threads = new Map();
let untraced = 0;

function short(id) { return id ? id.slice(0, 16) : "?"; }

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function ago(ts) {
  const s = Math.max(0, (Date.now() / 1000) - ts);
  if (s < 60) return `${Math.floor(s)}s ago`;
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  return `${Math.floor(s / 3600)}h ago`;
}

function dotClass(t) {
  if (t.requests === 0 && t.markers === 0) return "dot";      // spawned, nothing observed yet
  if (t.last_status === null && t.requests > 0) return "dot busy"; // request in flight
  return t.last_status && t.last_status >= 400 ? "dot err" : "dot ok";
}

function edgeBadge(t) {
  if (t.thread_id === t.root_id) return '<span class="badge root">root</span>';
  if (!t.edge) return '<span class="badge pending">position pending</span>';
  return t.edge.edge_type === "tool_call"
    ? `<span class="badge tool">via ${esc(t.edge.tool_call_id || "?")} · tool_call</span>`
    : `<span class="badge prog">${esc(t.edge.edge_type)}</span>`;
}

function statsLine(t) {
  const calls = `${t.requests} model call${t.requests === 1 ? "" : "s"}`;
  const markers = t.markers ? ` · ${t.markers} marker${t.markers === 1 ? "" : "s"}` : "";
  return `${calls}${markers} · ${ago(t.last_seen)}`;
}

function turnRow(role, text) {
  return `<div class="turn">
    <span class="role ${esc(role)}">${esc(role)}</span>
    <span class="text">${esc(text)}</span>
  </div>`;
}

// One tool-call box: the call itself, its result (if the follow-up
// request revealed it), and any child threads whose spawn edge carries
// this exact tool-call id — the tree grows out of the conversation.
function toolBox(call, result, kidIds, childIndex) {
  const kids = kidIds.length
    ? `<div class="tool-kids">${kidIds.map(k => renderNode(k, childIndex)).join("")}</div>`
    : "";
  return `<div class="toolbox">
    <div class="tool-head mono">⚙ ${esc(call.name)}(${esc(call.arguments)})
      <span class="tool-id">${esc(call.id)}</span></div>
    ${result && result.text ? turnRow("tool", result.text) : ""}
    ${kids}
  </div>`;
}

function renderNode(id, childIndex) {
  const t = threads.get(id);
  const kids = childIndex.get(id) || [];
  const turns = t.conversation || [];

  // Tool results leave the flow: each renders inside its call's box.
  const resultsByCall = new Map();
  const flow = [];
  for (const u of turns) {
    if (u.role === "tool" && u.tool_call_id) resultsByCall.set(u.tool_call_id, u);
    else flow.push(u);
  }

  // Anchor children at their spawning tool call when the parent's
  // conversation already shows that call; until then (or for
  // programmatic spawns) they attach below the conversation.
  const callIds = new Set();
  for (const u of flow) for (const c of (u.tool_calls || [])) if (c.id) callIds.add(c.id);
  const anchored = new Map();
  const loose = [];
  for (const k of kids) {
    const edge = threads.get(k).edge;
    const callId = edge && edge.tool_call_id;
    if (callId && callIds.has(callId)) {
      if (!anchored.has(callId)) anchored.set(callId, []);
      anchored.get(callId).push(k);
    } else {
      loose.push(k);
    }
  }

  const turnHtml = flow.map(u => {
    let html = u.text ? turnRow(u.role, u.text) : "";
    for (const c of (u.tool_calls || []))
      html += toolBox(c, resultsByCall.get(c.id), anchored.get(c.id) || [], childIndex);
    return html;
  }).join("");
  const replyRow = t.reply
    ? turnRow("assistant", t.reply)
    : (t.last_status === null && t.requests > 0 ? turnRow("assistant", "…") : "");

  return `
    <div class="node">
      <div class="node-line">
        <span class="${dotClass(t)}"></span>
        <span class="mono">${short(id)}</span>
        ${edgeBadge(t)}
        <span class="stats">${statsLine(t)}</span>
      </div>
      ${(turnHtml || replyRow) ? `<div class="convo">${turnHtml}${replyRow}</div>` : ""}
      ${loose.length ? `<div class="kids">${loose.map(k => renderNode(k, childIndex)).join("")}</div>` : ""}
    </div>`;
}

function render() {
  const groups = new Map();      // root_id -> thread ids
  const childIndex = new Map();  // parent thread_id -> child ids
  for (const [id, t] of threads) {
    if (!groups.has(t.root_id)) groups.set(t.root_id, []);
    groups.get(t.root_id).push(id);
    if (t.parent) {
      if (!childIndex.has(t.parent)) childIndex.set(t.parent, []);
      childIndex.get(t.parent).push(id);
    }
  }
  for (const kids of childIndex.values())
    kids.sort((a, b) => threads.get(a).first_seen - threads.get(b).first_seen);

  const orderedGroups = [...groups.entries()].sort((a, b) => {
    const fa = Math.min(...a[1].map(id => threads.get(id).first_seen));
    const fb = Math.min(...b[1].map(id => threads.get(id).first_seen));
    return fb - fa; // newest tree first
  });

  const html = orderedGroups.map(([root, ids]) => {
    // Top level: the root itself plus threads with no claimed parent yet.
    const top = ids
      .filter(id => id === root || !threads.get(id).parent)
      .sort((a, b) => (a === root ? -1 : b === root ? 1 : 0));
    return `<div class="tree-group">
      <h2>tree <span class="mono">${short(root)}</span> — ${ids.length} thread(s)</h2>
      ${top.map(id => renderNode(id, childIndex)).join("")}
    </div>`;
  }).join("");

  document.getElementById("forest").innerHTML =
    html || '<div class="empty">no traced traffic yet</div>';
  document.getElementById("untraced").textContent =
    untraced ? `${untraced} request(s) passed through without trace headers` : "";
}

let renderQueued = false;
function queueRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}

const source = new EventSource("/trace/threads");
const statusEl = document.getElementById("status");
source.onopen = () => { statusEl.textContent = "live"; };
source.onerror = () => { statusEl.textContent = "reconnecting…"; };
source.onmessage = (msg) => {
  const data = JSON.parse(msg.data);
  if (data.type === "meta") untraced = data.untraced;
  else threads.set(data.thread_id, data);
  queueRender();
};
setInterval(queueRender, 5000); // keep the relative timestamps fresh
</script>
</body>
</html>
