<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>trace-proxy</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1c2330; --muted: #68738a;
    --line: #d6dbe6; --accent: #3757c4; --ok: #2f8a4c; --warn: #b3661d; --err: #b03636;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 12px;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--card);
  }
  header h1 { font-size: 16px; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; }
  #status { margin-left: auto; font-size: 13px; color: var(--muted); }
  main { max-width: 1200px; margin: 0 auto; padding: 20px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .tree { margin-bottom: 30px; overflow-x: auto; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }

  /* A conversation is a vertical chain of turn boxes on a trunk line;
     the trunk runs behind the boxes, so gaps read as connectors. */
  .chain { position: relative; }
  .chain::before {
    content: ""; position: absolute; left: 26px; top: 12px; bottom: 16px;
    width: 2px; background: var(--line);
  }
  /* Thread identity rides as a strip attached to the head of the
     chain's first box (standalone only when the thread has no turns). */
  .thead {
    position: relative; z-index: 1; display: flex; align-items: center;
    gap: 7px; background: #f8f9fc; font-size: 12px; max-width: 480px;
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 11px;
    margin: 14px 0;
  }
  .thead:has(+ .tbox) { border-bottom: 0; border-radius: 6px 6px 0 0; margin-bottom: 0; }
  .thead + .tbox { margin-top: 0; border-top-left-radius: 0; border-top-right-radius: 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.err { background: var(--err); }
  .dot.busy { background: var(--warn); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .badge {
    font-size: 10.5px; padding: 0 7px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
  }
  .badge.root { color: var(--accent); border-color: var(--accent); }
  .badge.tool { color: var(--ok); border-color: var(--ok); }
  .badge.prog { color: var(--warn); border-color: var(--warn); }
  .badge.pending { color: var(--err); border-color: var(--err); }
  .stats { color: var(--muted); font-size: 11.5px; }

  .tbox {
    position: relative; z-index: 1; background: var(--card);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 7px 11px; margin: 14px 0; max-width: 480px;
    display: flex; gap: 9px; align-items: baseline; flex-wrap: wrap;
  }
  .tbox .role { flex: none; font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
                text-transform: uppercase; color: var(--muted); }
  .tbox .role.user { color: var(--accent); }
  .tbox .role.assistant { color: var(--ok); }
  .tbox .role.tool { color: var(--warn); }
  .tbox .text { white-space: pre-wrap; overflow-wrap: anywhere; flex: 1; min-width: 0; }
  .tbox.tool { border-left: 3px solid var(--warn); }
  .tbox .tres { width: 100%; color: var(--muted); font-size: 12px; overflow-wrap: anywhere;
                white-space: pre-wrap; }
  /* Only very long texts get compressed (click the chain to expand). */
  .chain:not(.expanded) > .tbox > .long {
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  }

  /* A spawned conversation branches right, off its tool box, with an
     elbow into the parent trunk. The parent trunk continues behind it. */
  .branch { position: relative; margin: 14px 0 14px 64px; }
  .branch::before {
    content: ""; position: absolute; left: -38px; top: -8px; width: 38px; height: 26px;
    border-left: 2px solid var(--line); border-bottom: 2px solid var(--line);
    border-bottom-left-radius: 10px;
  }
  #untraced { color: var(--muted); font-size: 13px; margin-top: 18px; }
</style>
</head>
<body>
<header>
  <h1>trace-proxy</h1>
  <span class="sub">conversation graph — sub-agents branch off the tool call that spawned them · click to expand text</span>
  <span id="status">connecting…</span>
</header>
<main>
  <div id="forest"><div class="empty">no traced traffic yet</div></div>
  <div id="untraced"></div>
</main>
<script>
"use strict";

// Server-side ThreadStore is the source of truth; every SSE message is
// a full thread record (an upsert) or a {type:"meta"} counter update.
const threads = new Map();
let untraced = 0;
const expanded = new Set(); // chains the viewer expanded (survives re-renders)

function short(id) { return id ? id.slice(0, 16) : "?"; }

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function ago(ts) {
  const s = Math.max(0, (Date.now() / 1000) - ts);
  if (s < 60) return `${Math.floor(s)}s ago`;
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  return `${Math.floor(s / 3600)}h ago`;
}

function dotClass(t) {
  if (t.requests === 0 && t.markers === 0) return "dot";
  if (t.last_status === null && t.requests > 0) return "dot busy";
  return t.last_status && t.last_status >= 400 ? "dot err" : "dot ok";
}

// Texts under this length always show whole; longer ones compress to a
// few lines until the chain is clicked open.
const LONG_TEXT = 280;
const longCls = (s) => (s && s.length > LONG_TEXT ? " long" : "");

function turnBox(role, text) {
  return `<div class="tbox">
    <span class="role ${esc(role)}">${esc(role)}</span>
    <span class="text${longCls(text)}">${esc(text)}</span>
  </div>`;
}

function toolBox(call, result) {
  const head = `${call.name}(${call.arguments})`;
  return `<div class="tbox tool">
    <span class="role tool">tool</span>
    <span class="text mono${longCls(head)}">${esc(head)}</span>
    ${result && result.text
      ? `<span class="tres${longCls(result.text)}">→ ${esc(result.text)}</span>`
      : ""}
  </div>`;
}

function threadHeader(t) {
  const isRoot = t.thread_id === t.root_id;
  const orphan = !isRoot && !t.parent;
  let badge = "";
  if (isRoot) badge = '<span class="badge root">root</span>';
  else if (orphan) badge = '<span class="badge pending">position pending</span>';
  else if (t.edge && t.edge.edge_type === "tool_call")
    badge = `<span class="badge tool">via ${esc(t.edge.tool_call_id || "?")}</span>`;
  else if (t.edge) badge = `<span class="badge prog">${esc(t.edge.edge_type)}</span>`;
  const markers = t.markers ? ` · ${t.markers} marker${t.markers === 1 ? "" : "s"}` : "";
  return `<div class="thead">
    <span class="${dotClass(t)}"></span>
    <span class="mono">${short(t.thread_id)}</span>
    ${badge}
    <span class="stats">${t.requests} call${t.requests === 1 ? "" : "s"}${markers}
      · <span data-ago="${t.last_seen}">${ago(t.last_seen)}</span></span>
  </div>`;
}

// One conversation as a vertical chain of turn boxes. Child threads
// branch right, inline after the tool box that spawned them; the
// parent's trunk continues down to its final assistant box.
function chainHTML(id, childIndex, visited) {
  if (visited.has(id)) return "";
  visited.add(id);
  const t = threads.get(id);
  const kids = (childIndex.get(id) || []).slice();

  const turns = t.conversation || [];
  const resultsByCall = new Map();
  const flow = [];
  for (const u of turns) {
    if (u.role === "tool" && u.tool_call_id) resultsByCall.set(u.tool_call_id, u);
    else flow.push(u);
  }

  const branch = (kid) =>
    `<div class="branch">${chainHTML(kid, childIndex, visited)}</div>`;

  let body = "";
  for (const u of flow) {
    if (u.text) body += turnBox(u.role, u.text);
    for (const c of (u.tool_calls || [])) {
      body += toolBox(c, resultsByCall.get(c.id));
      // Children spawned by this exact tool call branch off right here.
      for (const kid of kids.filter(k => {
        const e = threads.get(k).edge;
        return e && e.tool_call_id && e.tool_call_id === c.id;
      })) {
        body += branch(kid);
        kids.splice(kids.indexOf(kid), 1);
      }
    }
  }
  if (t.reply) body += turnBox("assistant", t.reply);
  else if (t.last_status === null && t.requests > 0) body += turnBox("assistant", "…");
  // Programmatic / not-yet-anchored children hang off the chain's end.
  for (const kid of kids) body += branch(kid);

  const cls = expanded.has(id) ? "chain expanded" : "chain";
  return `<div class="${cls}" data-tid="${esc(id)}">${threadHeader(t)}${body}</div>`;
}

function render() {
  const groups = new Map();      // root_id -> thread ids
  const childIndex = new Map();  // parent thread_id -> child ids
  for (const [id, t] of threads) {
    if (!groups.has(t.root_id)) groups.set(t.root_id, []);
    groups.get(t.root_id).push(id);
    if (t.parent) {
      if (!childIndex.has(t.parent)) childIndex.set(t.parent, []);
      childIndex.get(t.parent).push(id);
    }
  }
  for (const kids of childIndex.values())
    kids.sort((a, b) => threads.get(a).first_seen - threads.get(b).first_seen);

  const orderedGroups = [...groups.entries()].sort((a, b) => {
    const fa = Math.min(...a[1].map(id => threads.get(id).first_seen));
    const fb = Math.min(...b[1].map(id => threads.get(id).first_seen));
    return fb - fa; // newest tree first
  });

  const html = orderedGroups.map(([root, ids]) => {
    const visited = new Set();
    // Top level: the root first, then any thread with no claimed parent.
    const top = ids
      .filter(id => id === threads.get(id).root_id || !threads.get(id).parent)
      .sort((a, b) => {
        const ra = a === threads.get(a).root_id, rb = b === threads.get(b).root_id;
        if (ra !== rb) return ra ? -1 : 1;
        return threads.get(a).first_seen - threads.get(b).first_seen;
      });
    return `<div class="tree">${top.map(id => chainHTML(id, childIndex, visited)).join("")}</div>`;
  }).join("");

  document.getElementById("forest").innerHTML =
    html || '<div class="empty">no traced traffic yet</div>';
  document.getElementById("untraced").textContent =
    untraced ? `${untraced} request(s) passed through without trace headers` : "";
}

let renderQueued = false;
function queueRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}

// Click anywhere in a chain to toggle full turn text (innermost chain wins).
document.addEventListener("click", (e) => {
  const chain = e.target.closest(".chain");
  if (!chain) return;
  const tid = chain.dataset.tid;
  if (expanded.has(tid)) expanded.delete(tid); else expanded.add(tid);
  queueRender();
});

const source = new EventSource("/trace/threads");
const statusEl = document.getElementById("status");
source.onopen = () => { statusEl.textContent = "live"; };
source.onerror = () => { statusEl.textContent = "reconnecting…"; };
source.onmessage = (msg) => {
  const data = JSON.parse(msg.data);
  if (data.type === "meta") untraced = data.untraced;
  else threads.set(data.thread_id, data);
  queueRender();
};

// Refresh relative timestamps in place — no full re-render.
setInterval(() => {
  for (const el of document.querySelectorAll("[data-ago]"))
    el.textContent = ago(Number(el.dataset.ago));
}, 5000);
</script>
</body>
</html>
