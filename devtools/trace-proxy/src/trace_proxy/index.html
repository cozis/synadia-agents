<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>trace-proxy</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1c2330; --muted: #68738a;
    --line: #e2e6ee; --accent: #3757c4; --ok: #2f8a4c; --warn: #b3661d; --err: #b03636;
    --box: #f2f5fb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 12px;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--card);
  }
  header h1 { font-size: 16px; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; }
  #status { margin-left: auto; font-size: 13px; color: var(--muted); }
  main { max-width: 1400px; margin: 0 auto; padding: 20px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .tree-group {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    margin-bottom: 16px; padding: 14px 18px; overflow-x: auto;
  }
  .tree-group > h2 { font-size: 13px; margin: 0 0 12px; color: var(--muted); font-weight: 600; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
  .graph { position: relative; }
  .graph svg { position: absolute; top: 0; left: 0; pointer-events: none; }
  .gnode {
    position: absolute; width: 300px; background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    box-shadow: 0 1px 3px rgba(28, 35, 48, 0.07); cursor: pointer;
  }
  .gnode.root { border-left: 3px solid var(--accent); }
  .gnode.pending { border-left: 3px solid var(--err); }
  .node-line { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 4px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.err { background: var(--err); }
  .dot.busy { background: var(--warn); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .badge {
    font-size: 10.5px; padding: 0 7px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
  }
  .badge.root { color: var(--accent); border-color: var(--accent); }
  .badge.pending { color: var(--err); border-color: var(--err); }
  .stats { color: var(--muted); font-size: 11.5px; width: 100%; }
  .turn { display: flex; gap: 7px; padding: 2px 0; font-size: 12px; }
  .turn .role { flex: none; width: 58px; font-size: 10.5px; text-transform: uppercase;
                letter-spacing: 0.04em; color: var(--muted); padding-top: 1px; }
  .turn .role.user { color: var(--accent); }
  .turn .role.assistant { color: var(--ok); }
  .turn .role.tool { color: var(--warn); }
  .turn .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .gnode:not(.expanded) .turn .text {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .tcall {
    border: 1px solid var(--line); border-left: 3px solid var(--warn);
    background: var(--box); border-radius: 6px; margin: 4px 0; padding: 4px 8px;
    font-size: 12px;
  }
  .tcall .tool-head { color: var(--warn); overflow-wrap: anywhere; }
  .gnode:not(.expanded) .tcall .tool-head {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .edge-tool { stroke: var(--ok); }
  .edge-prog { stroke: var(--warn); stroke-dasharray: 5 4; }
  .edge-label { font: 10.5px ui-monospace, Menlo, Consolas, monospace; fill: var(--muted); }
  #untraced { color: var(--muted); font-size: 13px; margin-top: 18px; }
</style>
</head>
<body>
<header>
  <h1>trace-proxy</h1>
  <span class="sub">agent graph — edges leave the tool call that spawned the child · click a card to expand</span>
  <span id="status">connecting…</span>
</header>
<main>
  <div id="forest"><div class="empty">no traced traffic yet</div></div>
  <div id="untraced"></div>
</main>
<script>
"use strict";

// Server-side ThreadStore is the source of truth; every SSE message is
// a full thread record (an upsert) or a {type:"meta"} counter update.
const threads = new Map();
let untraced = 0;
const expanded = new Set(); // card ids the viewer expanded (survives re-renders)

const CARD_W = 300, X_GAP = 70, Y_GAP = 20;

function short(id) { return id ? id.slice(0, 16) : "?"; }

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function ago(ts) {
  const s = Math.max(0, (Date.now() / 1000) - ts);
  if (s < 60) return `${Math.floor(s)}s ago`;
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  return `${Math.floor(s / 3600)}h ago`;
}

function dotClass(t) {
  if (t.requests === 0 && t.markers === 0) return "dot";
  if (t.last_status === null && t.requests > 0) return "dot busy";
  return t.last_status && t.last_status >= 400 ? "dot err" : "dot ok";
}

function turnRow(role, text) {
  return `<div class="turn">
    <span class="role ${esc(role)}">${esc(role)}</span>
    <span class="text">${esc(text)}</span>
  </div>`;
}

// One thread card. Tool calls render as rows carrying data-call, so
// edges can be drawn from the exact row that spawned the child.
function cardHTML(t) {
  const isRoot = t.thread_id === t.root_id;
  const orphan = !isRoot && !t.parent;
  const turns = t.conversation || [];
  const resultsByCall = new Map();
  const flow = [];
  for (const u of turns) {
    if (u.role === "tool" && u.tool_call_id) resultsByCall.set(u.tool_call_id, u);
    else flow.push(u);
  }
  let body = "";
  for (const u of flow) {
    if (u.text) body += turnRow(u.role, u.text);
    for (const c of (u.tool_calls || [])) {
      const res = resultsByCall.get(c.id);
      body += `<div class="tcall" data-call="${esc(c.id)}">
        <div class="tool-head mono">⚙ ${esc(c.name)}(${esc(c.arguments)})</div>
        ${res && res.text ? turnRow("tool", res.text) : ""}
      </div>`;
    }
  }
  if (t.reply) body += turnRow("assistant", t.reply);
  else if (t.last_status === null && t.requests > 0) body += turnRow("assistant", "…");

  const markers = t.markers ? ` · ${t.markers} marker${t.markers === 1 ? "" : "s"}` : "";
  return `<div class="gnode${isRoot ? " root" : ""}${orphan ? " pending" : ""}${expanded.has(t.thread_id) ? " expanded" : ""}"
       data-tid="${esc(t.thread_id)}">
    <div class="node-line">
      <span class="${dotClass(t)}"></span>
      <span class="mono">${short(t.thread_id)}</span>
      ${isRoot ? '<span class="badge root">root</span>' : ""}
      ${orphan ? '<span class="badge pending">position pending</span>' : ""}
      <span class="stats">${t.requests} call${t.requests === 1 ? "" : "s"}${markers}
        · <span data-ago="${t.last_seen}">${ago(t.last_seen)}</span></span>
    </div>
    ${body}
  </div>`;
}

// Layered layout: column = depth, siblings stacked; a parent centers on
// its children but never collides with earlier cards in its column.
function layoutGraph(graphEl, ids) {
  const inGroup = new Set(ids);
  const cards = new Map();
  for (const el of graphEl.querySelectorAll(".gnode")) cards.set(el.dataset.tid, el);

  const childIndex = new Map();
  for (const id of ids) {
    const p = threads.get(id).parent;
    if (p && inGroup.has(p)) {
      if (!childIndex.has(p)) childIndex.set(p, []);
      childIndex.get(p).push(id);
    }
  }
  for (const kids of childIndex.values())
    kids.sort((a, b) => threads.get(a).first_seen - threads.get(b).first_seen);

  const depthOf = (id) => {
    let d = 0, t = threads.get(id);
    while (t.parent && inGroup.has(t.parent)) { d++; t = threads.get(t.parent); }
    return d;
  };

  const colCursor = [];
  const pos = new Map();
  function place(id) {
    const d = depthOf(id);
    const el = cards.get(id);
    const h = el.offsetHeight;
    colCursor[d] = colCursor[d] || 0;
    const kids = childIndex.get(id) || [];
    let y;
    if (kids.length) {
      const spans = kids.map(place);
      const mid = (spans[0].top + spans[spans.length - 1].bottom) / 2;
      y = Math.max(mid - h / 2, colCursor[d]);
    } else {
      y = colCursor[d];
    }
    colCursor[d] = y + h + Y_GAP;
    pos.set(id, { x: d * (CARD_W + X_GAP), y, h });
    el.style.left = pos.get(id).x + "px";
    el.style.top = y + "px";
    return { top: y, bottom: y + h };
  }

  const top = ids
    .filter(id => id === threads.get(id).root_id || !inGroup.has(threads.get(id).parent))
    .sort((a, b) => {
      const ra = a === threads.get(a).root_id, rb = b === threads.get(b).root_id;
      if (ra !== rb) return ra ? -1 : 1; // the root leads its group
      return threads.get(a).first_seen - threads.get(b).first_seen;
    });
  for (const id of top) place(id);

  const width = (Math.max(...ids.map(depthOf)) + 1) * (CARD_W + X_GAP) - X_GAP;
  const height = Math.max(...colCursor.filter(Boolean), 1);
  graphEl.style.width = width + "px";
  graphEl.style.height = height + "px";

  // Edges: from the spawning tool-call row inside the parent card (or
  // its header, when the edge has no tool call) to the child card.
  const svg = graphEl.querySelector("svg");
  svg.setAttribute("width", width);
  svg.setAttribute("height", height);
  let paths = "";
  for (const id of ids) {
    const t = threads.get(id);
    if (!t.parent || !inGroup.has(t.parent)) continue;
    const p = pos.get(t.parent), c = pos.get(id);
    if (!p || !c) continue;
    const parentEl = cards.get(t.parent);
    const callId = t.edge && t.edge.tool_call_id;
    const row = callId
      ? parentEl.querySelector(`[data-call="${CSS.escape(callId)}"]`)
      : null;
    const sy = p.y + (row ? row.offsetTop + row.offsetHeight / 2 : 16);
    const sx = p.x + CARD_W;
    const ey = c.y + 16;
    const ex = c.x;
    const cls = t.edge && t.edge.edge_type === "tool_call" ? "edge-tool" : "edge-prog";
    paths += `<path class="${cls}" fill="none" stroke-width="1.6"
      d="M ${sx} ${sy} C ${sx + X_GAP / 2} ${sy}, ${ex - X_GAP / 2} ${ey}, ${ex} ${ey}"
      marker-end="url(#arrow)"/>`;
    if (t.edge && t.edge.edge_type !== "tool_call")
      paths += `<text class="edge-label" x="${(sx + ex) / 2}" y="${(sy + ey) / 2 - 5}"
        text-anchor="middle">${esc(t.edge.edge_type)}</text>`;
  }
  svg.innerHTML = `<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4"
      markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#68738a"/></marker></defs>${paths}`;
}

function render() {
  const groups = new Map(); // root_id -> thread ids
  for (const [id, t] of threads) {
    if (!groups.has(t.root_id)) groups.set(t.root_id, []);
    groups.get(t.root_id).push(id);
  }
  const orderedGroups = [...groups.entries()].sort((a, b) => {
    const fa = Math.min(...a[1].map(id => threads.get(id).first_seen));
    const fb = Math.min(...b[1].map(id => threads.get(id).first_seen));
    return fb - fa; // newest tree first
  });

  const html = orderedGroups.map(([root, ids]) => `
    <div class="tree-group">
      <h2>tree <span class="mono">${short(root)}</span> — ${ids.length} thread(s)</h2>
      <div class="graph" data-root="${esc(root)}">
        <svg></svg>
        ${ids.map(id => cardHTML(threads.get(id))).join("")}
      </div>
    </div>`).join("");

  document.getElementById("forest").innerHTML =
    html || '<div class="empty">no traced traffic yet</div>';
  document.getElementById("untraced").textContent =
    untraced ? `${untraced} request(s) passed through without trace headers` : "";

  // Second pass: cards are in the DOM and measurable — position + wire.
  for (const [root, ids] of orderedGroups) {
    const el = document.querySelector(`.graph[data-root="${CSS.escape(root)}"]`);
    if (el) layoutGraph(el, ids);
  }
}

let renderQueued = false;
function queueRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}

// Click a card to toggle full conversation text (re-laid out to fit).
document.addEventListener("click", (e) => {
  const card = e.target.closest(".gnode");
  if (!card) return;
  const tid = card.dataset.tid;
  if (expanded.has(tid)) expanded.delete(tid); else expanded.add(tid);
  queueRender();
});

const source = new EventSource("/trace/threads");
const statusEl = document.getElementById("status");
source.onopen = () => { statusEl.textContent = "live"; };
source.onerror = () => { statusEl.textContent = "reconnecting…"; };
source.onmessage = (msg) => {
  const data = JSON.parse(msg.data);
  if (data.type === "meta") untraced = data.untraced;
  else threads.set(data.thread_id, data);
  queueRender();
};

// Refresh relative timestamps in place — no full re-render.
setInterval(() => {
  for (const el of document.querySelectorAll("[data-ago]"))
    el.textContent = ago(Number(el.dataset.ago));
}, 5000);
</script>
</body>
</html>
