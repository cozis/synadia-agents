# Observability fixture: the account boundary edge records cross.
#
# The fabric owns the TRACE stream and exports the edge subject with the
# caller's account pinned at token 2; each tenant imports its own slice
# and publishes the short form `TRACE.edges` (see `observability.md`,
# "Crossing the Account Boundary").
#
#   FABRIC — alice; JetStream host of the TRACE stream (tests create it).
#   APP    — bob; publishes `TRACE.edges`, which arrives as
#            `TRACE.APP.edges`. It can write but not read: a service
#            import only grants publishing toward the exporter.
#
# The import subject must carry the importer's OWN account name at the
# token position; another account's name there is rejected at config load.
# Port-less (see nkey-noaccounts.conf). Keys: keys.json.
accounts {
  FABRIC {
    jetstream: enabled
    users: [ { nkey: "UCDUW5V44EBDBIK2FL4CTNDBQFNGBEZVJHSZGQVKRHASN4AV4IWPB5NT" } ]
    exports: [
      { service: "TRACE.*.edges", account_token_position: 2 }
    ]
  }
  APP {
    users: [ { nkey: "UDLPRVYPNSPIPYH4RVGKEHP2AAG4J2CN4GQ3IBTKC6ZDV6SR7ONG27D4" } ]
    imports: [
      { service: { account: FABRIC, subject: "TRACE.APP.edges" }, to: "TRACE.edges" }
    ]
  }
}
